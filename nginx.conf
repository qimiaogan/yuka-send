# =============================================================================
# 食光家庭 + Yuka Send 合并 Nginx 配置
# Docker 挂载：./nginx.conf:/etc/nginx/nginx.conf:ro
# 域名：qimiaogan.cn (主站) + ws.anyuka.cn (Yuka Send 信令)
# 证书：宿主机 /etc/letsencrypt，容器挂载 /etc/letsencrypt
# 校验目录：/var/www/certbot
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    gzip on;

    # —— 限流 Zone（食光家庭用）——
    limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_upload:10m rate=2r/m;
    limit_req_zone $binary_remote_addr zone=api_chef:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=api_public:10m rate=15r/s;
    limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

    # ============ HTTP 80：ACME 校验 + 全站跳转 HTTPS ============
    server {
        listen 80 default_server;
        server_name qimiaogan.cn www.qimiaogan.cn ws.anyuka.cn;

        # Let's Encrypt 校验目录
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # 其余统一跳 HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ============ HTTPS 443：Yuka Send WebSocket 信令 ============
    # 独立 server block 专门处理 ws.anyuka.cn，避免和主站路由冲突
    server {
        listen 443 ssl http2;
        server_name ws.anyuka.cn;

        ssl_certificate     /etc/letsencrypt/live/ws.anyuka.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ws.anyuka.cn/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL_WS:10m;
        ssl_session_timeout 10m;

        # WebSocket 长连接（信令）+ HTTP 健康检查都反代到 Node.js
        location / {
            proxy_pass http://yuka-send:3000;
            proxy_http_version 1.1;

            # WebSocket 必需头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 标准反代头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket 长连接超时 1 小时
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_connect_timeout 30s;
        }

        # Nginx 自身健康检查（绕过反代）
        location = /healthz {
            return 200 "ok\n";
        }
    }

    # ============ HTTPS 443：食光家庭主站 ============
    server {
        listen 443 ssl http2;
        server_name qimiaogan.cn www.qimiaogan.cn;

        ssl_certificate     /etc/letsencrypt/live/qimiaogan.cn/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/qimiaogan.cn/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        client_max_body_size 20m;
        limit_conn conn_per_ip 20;

        # —— Java 后端 ——
        location /api/ {
            limit_req zone=api_general burst=50 nodelay;
            proxy_pass http://api-java:8511;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout 30s;
        }

        # —— 登录/注册（严限流）——
        location ~* ^/api/auth/(wx-login|login|register|test-login)$ {
            limit_req zone=api_auth burst=3 nodelay;
            proxy_pass http://api-java:8511;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # —— 文件上传 ——
        location ~* ^/api/(upload|dishes/.*/photo|photos/.*/upload)$ {
            limit_req zone=api_upload burst=2 nodelay;
            proxy_pass http://api-java:8511;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout 300s;
        }

        # —— 厨神 AI（流式关闭缓冲）——
        location /api/chef/ {
            limit_req zone=api_chef burst=5 nodelay;
            proxy_pass http://api-java:8511;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_read_timeout    600s;
            proxy_send_timeout    600s;
            proxy_connect_timeout 30s;
            proxy_buffering off;
            proxy_request_buffering off;
            gzip off;
            add_header X-Accel-Buffering no;
        }

        # —— 公共 discover ——
        location ~* ^/api/discover/ {
            limit_req zone=api_public burst=30 nodelay;
            proxy_pass http://api-java:8511;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
        }

        # —— Python AI 服务 ——
        location /ai/ {
            limit_req zone=api_general burst=20 nodelay;
            proxy_pass http://ai-python:8512;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }

        # —— Nginx 健康检查 ——
        location = /healthz {
            return 200 "ok\n";
        }

        # —— 限流返回 429 ——
        limit_req_status 429;
        limit_conn_status 429;
        error_page 429 = @rate_limited;
        location @rate_limited {
            default_type application/json;
            return 429 '{"code":429,"msg":"请求太频繁，请稍后再试"}';
        }
    }
}
